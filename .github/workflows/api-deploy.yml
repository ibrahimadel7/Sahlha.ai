name: Deploy sahlha-api

# CD for the native Workers API. Runs on every push to `deployment`
# that touches the API worker. Deploys workers/sahlha-api to Cloudflare.
on:
  push:
    branches: [deployment]
    paths:
      - 'workers/sahlha-api/**'
      - '.github/workflows/api-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Fail fast with an actionable message when the Cloudflare credentials
      # are not configured (repo Settings → Secrets and variables → Actions).
      # Without these, wrangler fails with a generic auth error.
      - name: Check Cloudflare secrets
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set (repo Settings → Secrets and variables → Actions → New repository secret)."; missing=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set (Cloudflare dashboard → account → copy ID; same Secrets page)."; missing=1; fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/sahlha-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: workers/sahlha-api

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: workers/sahlha-api

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sahlha-api
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
