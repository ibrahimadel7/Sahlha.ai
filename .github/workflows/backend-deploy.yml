name: Deploy sahlha-backend (Containers)

# CD for the Python backend running on Cloudflare Containers.
# Runs on every push to `deployment` that touches the backend.
# Deploys workers/backend-proxy (builds ../../Dockerfile, pushes the
# image, rolls out container instances).
#
# Requires: Workers Paid plan on the Cloudflare account, otherwise the
# image-push step fails with "Deploying containers requires the
# Workers Paid plan." The ubuntu runner already includes Docker.
on:
  push:
    branches: [deployment]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'requirements-ai.txt'
      - 'sahlha/**'
      - 'workers/backend-proxy/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Fail fast with an actionable message when the Cloudflare credentials
      # are not configured (repo Settings → Secrets and variables → Actions).
      # Without these, wrangler fails with a generic auth error.
      - name: Check Cloudflare secrets
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set (repo Settings → Secrets and variables → Actions → New repository secret)."; missing=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set (Cloudflare dashboard → account → copy ID; same Secrets page)."; missing=1; fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/backend-proxy/package-lock.json

      - name: Install proxy dependencies
        run: npm ci
        working-directory: workers/backend-proxy

      - name: Typecheck proxy
        run: npx tsc --noEmit
        working-directory: workers/backend-proxy

      - name: Deploy to Cloudflare Containers
        # Free-tier accounts cannot push container images (the API returns
        # "Deploying containers requires the Workers Paid plan"). The proxy
        # worker (src/index.ts) detects the missing container at runtime and
        # serves traffic via its FALLBACK_API service binding to sahlha-api,
        # so deploy the worker WITHOUT building containers here.
        # After upgrading to Workers Paid, change the command back to
        # `deploy` so the Dockerfile image is built, pushed and rolled out.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/backend-proxy
          command: deploy --containers-rollout none
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
