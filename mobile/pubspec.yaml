name: sahlha
description: Sahlha — adaptive learning app for every learner.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing + networking
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  dio: ^5.11.1

  # Storage / files / media
  flutter_secure_storage: ^11.1.1
  file_picker: ^13.0.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # UI
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  device_preview: ^1.2.0
  flutter_markdown: ^0.7.7

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/sounds/

# App launcher icons generated from the Sahlha robot logo.
# Source files (drop your PNGs here):
#   assets/logo/sahlha_logo.png -> full lockup (robot + "Sahlha") for in-app use
#   assets/logo/sahlha_icon.png  -> icon-only (robot head, no wordmark) for launchers
# Then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  windows:
    generate: false
  macos:
    generate: false
  image_path: "assets/logo/sahlha_icon.png"
  adaptive_icon_background: "#FBFAF7"
  adaptive_icon_foreground: "assets/logo/sahlha_icon.png"
  web_background_color: "#FBFAF7"
  web_theme_color: "#0E9388"
  background_color: "#FBFAF7"
